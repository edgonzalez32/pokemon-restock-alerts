name: Restock check

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's fastest schedule; each run checks every minute for ~4 min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Load previous state
        run: |
          git fetch --depth=1 origin status 2>/dev/null || true
          git show origin/status:state.json > state.json 2>/dev/null || echo '{}' > state.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Target and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOP_SECONDS: "230"
          INTERVAL: "60"
        run: python checker.py

      - name: Save state for the next run and the dashboard
        if: always()
        run: |
          mkdir -p /tmp/status && cp state.json status.json /tmp/status/ 2>/dev/null || true
          cd /tmp/status
          git init -q -b status
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add -A && git commit -q -m "status $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
